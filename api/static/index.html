<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #4f46e5; --brand-dark: #4338ca; --brand-50: #eef0ff;
    --ink: #1e293b; --muted: #64748b; --border: #e5e7eb; --bg-soft: #f8fafc;
    --green: #10b981; --green-bg: #ecfdf5; --green-text: #047857; --green-border: #a7f3d0;
    --amber: #f59e0b; --amber-bg: #fffbeb; --amber-text: #b45309; --amber-border: #fde68a;
    --red: #ef4444; --red-bg: #fef2f2; --red-text: #b91c1c; --red-border: #fecaca;
    --gray-bg: #f1f5f9; --gray-text: #475569;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--ink);
    background: radial-gradient(circle at top, #f8fafc 0%, #eef0f6 55%, #e9ebf3 100%);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 3px rgba(79,70,229,.35); }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  .brand p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: var(--gray-bg); color: var(--gray-text); border: 1px solid var(--border); white-space: nowrap; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }
  .badge.ok { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); }
  .badge.ok .dot { background: var(--green); }

  .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.04); padding: 24px; margin-bottom: 20px; }
  .card.disabled { opacity: .45; filter: grayscale(.3); pointer-events: none; }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .step-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--brand-50); color: var(--brand); font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .step-num.done { background: var(--green-bg); color: var(--green-text); }
  .card-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .card-head .hint { font-size: 12px; color: #94a3b8; margin-left: auto; }

  .tabs { display: inline-flex; background: var(--gray-bg); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tab { border: none; background: none; font-size: 13px; font-weight: 600; color: var(--muted); padding: 7px 16px; border-radius: 7px; cursor: pointer; }
  .tab.active { background: #fff; color: var(--brand); box-shadow: 0 1px 2px rgba(16,24,40,.08); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
  .field label .opt { font-weight: 400; color: #94a3b8; }
  .input, select.input { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 13px; font-size: 14px; font-family: inherit; color: var(--ink); background: #fff; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .row2 { display: flex; gap: 14px; }
  .row2 > div { flex: 1; min-width: 0; }

  .file-label { display: flex; align-items: center; gap: 9px; border: 1.5px dashed #c7cad1; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #6b7280; cursor: pointer; }
  .file-label:hover { border-color: var(--brand); background: #fafaff; }
  .file-label input[type=file] { display: none; }

  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 600; font-size: 13.5px; border: none; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-primary:disabled { background: #c7c9f5; cursor: not-allowed; }
  .btn-ghost { background: var(--gray-bg); color: #374151; }
  .btn-ghost:hover { background: #e5e7eb; }
  .btn-ghost:disabled { color: #a3a9b4; cursor: not-allowed; }

  .msg { margin-top: 12px; font-size: 13px; padding: 10px 14px; border-radius: 10px; }
  .msg.err { color: var(--red-text); background: var(--red-bg); border: 1px solid var(--red-border); }
  .msg.ok { color: var(--green-text); background: var(--green-bg); border: 1px solid var(--green-border); }
  .hide { display: none !important; }

  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .label-pill { font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
  .score-big { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .score-of { color: #94a3b8; font-size: 13px; }
  .reason-box { font-size: 13.5px; color: #475569; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 22px; }

  .sub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .sub-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .sub-card .name { font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .sub-card .value { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .sub-card .value.na { color: #cbd5e1; }
  .bar-track { background: #e9edf3; border-radius: 999px; height: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }

  .heatmap-cap { font-size: 11.5px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
  .heatmap-img { width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block; }

  details summary { cursor: pointer; font-size: 12px; font-weight: 600; color: #94a3b8; }
  details[open] summary { color: #64748b; }
  pre.raw { margin-top: 10px; background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 14px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; }

  .footer { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 32px; }
  .footer a { color: #94a3b8; }

  @media (max-width: 480px) {
    .row2 { flex-direction: column; gap: 16px; }
    .sub-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <h1>ForgeGuard</h1>
        <p>AI document forgery detection &amp; verification</p>
      </div>
    </div>
    <div class="badge" id="authBadge"><span class="dot"></span>Not signed in</div>
  </div>

  <!-- Step 1: Account -->
  <section class="card">
    <div class="card-head">
      <span class="step-num" id="stepNum0">1</span>
      <h2>Account</h2>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" id="tabLogin">Sign in</button>
      <button type="button" class="tab" id="tabRegister">Create account</button>
    </div>

    <form id="authForm">
      <div class="field">
        <label>Email</label>
        <input class="input" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" name="password" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="authSubmit"><span>Sign in</span></button>
    </form>
    <p id="authMsg" class="msg hide"></p>
  </section>

  <!-- Step 2: Register signature -->
  <section class="card disabled" id="step1">
    <div class="card-head">
      <span class="step-num" id="stepNum1">2</span>
      <h2>Register a reference signature</h2>
      <span class="hint">optional</span>
    </div>
    <form id="sigForm">
      <div class="field">
        <label>Signer ID</label>
        <input class="input" name="signer_id" placeholder="e.g. jane_doe" required>
      </div>
      <div class="field">
        <label>Signature crop image</label>
        <label class="file-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="sigFileLabel">Choose an image…</span>
          <input type="file" name="image" accept="image/*" required>
        </label>
      </div>
      <button type="submit" class="btn btn-ghost">Register signature</button>
    </form>
    <p id="sigMsg" class="msg hide"></p>
  </section>

  <!-- Step 3: Verify document -->
  <section class="card disabled" id="step2">
    <div class="card-head">
      <span class="step-num" id="stepNum2">3</span>
      <h2>Verify a document</h2>
    </div>
    <form id="docForm">
      <div class="row2">
        <div class="field">
          <label>Document type</label>
          <select class="input" name="doc_type">
            <option value="identity">Identity card</option>
            <option value="certificate">Certificate</option>
            <option value="invoice">Invoice</option>
            <option value="legal">Legal document</option>
          </select>
        </div>
        <div class="field">
          <label>Signer ID <span class="opt">(optional)</span></label>
          <input class="input" name="signer_id" placeholder="e.g. jane_doe">
        </div>
      </div>
      <div class="field">
        <label>Document image</label>
        <label class="file-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="docFileLabel">Choose an image…</span>
          <input type="file" name="file" accept="image/*" required>
        </label>
      </div>
      <button type="submit" class="btn btn-primary" id="verifyBtn"><span>Verify document</span></button>
    </form>
  </section>

  <!-- Results -->
  <section class="card hide" id="resultsSection">
    <div class="card-head"><h2>Result</h2></div>

    <div class="result-top">
      <span class="label-pill" id="labelBadge"></span>
      <span class="score-big" id="scoreText">—</span>
      <span class="score-of">/ 100</span>
    </div>

    <p class="reason-box" id="reasonText"></p>

    <div class="sub-grid" id="subScoreGrid"></div>

    <div id="heatmapWrap" class="hide">
      <p class="heatmap-cap">Tamper heatmap overlay</p>
      <img id="heatmap" class="heatmap-img">
    </div>

    <details>
      <summary>Raw response</summary>
      <pre class="raw" id="rawJson"></pre>
    </details>
  </section>

  <p class="footer">
    ForgeGuard — college major project, REVA University ·
    <a href="https://github.com/Pranav-error/ForgeGuard-Project">source</a>
  </p>
</div>

<script>
let token = null;
let authMode = 'login';

const el = (id) => document.getElementById(id);
const authHeaders = () => token ? { 'Authorization': 'Bearer ' + token } : {};

function setAuthed(role) {
  const b = el('authBadge');
  b.className = 'badge ok';
  b.innerHTML = '<span class="dot"></span>Signed in · ' + role;
  el('stepNum0').classList.add('done');
  el('stepNum0').textContent = '✓';
  el('step1').classList.remove('disabled');
  el('step2').classList.remove('disabled');
}

function setTab(mode) {
  authMode = mode;
  el('tabLogin').classList.toggle('active', mode === 'login');
  el('tabRegister').classList.toggle('active', mode === 'register');
  el('authSubmit').querySelector('span').textContent = mode === 'login' ? 'Sign in' : 'Create account';
  el('authMsg').classList.add('hide');
}
el('tabLogin').onclick = () => setTab('login');
el('tabRegister').onclick = () => setTab('register');

function showMsg(id, text, kind) {
  const t = el(id);
  t.textContent = text;
  t.className = 'msg ' + kind;
}

function setLoading(btn, loading, label) {
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span><span>Working…</span>' : '<span>' + label + '</span>';
}

el('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  el('authMsg').classList.add('hide');
  const btn = el('authSubmit');
  const label = authMode === 'login' ? 'Sign in' : 'Create account';
  setLoading(btn, true, label);
  try {
    const path = authMode === 'login' ? '/auth/login' : '/auth/register';
    const r = await fetch(path, { method: 'POST', body: new FormData(e.target) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Something went wrong');
    if (authMode === 'register') {
      showMsg('authMsg', 'Account created — now sign in.', 'ok');
      setTab('login');
    } else {
      token = data.token;
      setAuthed(data.role);
    }
  } catch (err) {
    showMsg('authMsg', err.message, 'err');
  } finally {
    setLoading(btn, false, label);
  }
});

document.querySelectorAll('input[type=file]').forEach((input) => {
  input.addEventListener('change', () => {
    const labelId = input.closest('#sigForm') ? 'sigFileLabel' : 'docFileLabel';
    el(labelId).textContent = input.files[0] ? input.files[0].name : 'Choose an image…';
  });
});

el('sigForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  setLoading(btn, true, 'Register signature');
  try {
    const r = await fetch('/signatures', { method: 'POST', body: new FormData(e.target), headers: authHeaders() });
    const data = await r.json();
    if (!r.ok) showMsg('sigMsg', data.detail || 'Failed to register signature', 'err');
    else showMsg('sigMsg', 'Reference signature registered for "' + data.signer_id + '".', 'ok');
  } finally {
    setLoading(btn, false, 'Register signature');
  }
});

const SCORE_COLORS = {
  Genuine:    { bg: 'var(--green-bg)', text: 'var(--green-text)', bar: 'var(--green)' },
  Suspicious: { bg: 'var(--amber-bg)', text: 'var(--amber-text)', bar: 'var(--amber)' },
  Forged:     { bg: 'var(--red-bg)',   text: 'var(--red-text)',   bar: 'var(--red)' },
  Failed:     { bg: 'var(--gray-bg)',  text: 'var(--gray-text)',  bar: '#94a3b8' },
};

function renderSubScore(name, value) {
  const missing = value === null || value === undefined;
  const pct = missing ? 0 : Math.max(0, Math.min(100, value));
  const color = missing ? '#cbd5e1' : pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--red)';
  return `
    <div class="sub-card">
      <div class="name">${name}</div>
      <div class="value ${missing ? 'na' : ''}">${missing ? 'N/A' : pct}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${missing ? 0 : pct}%;background:${color}"></div></div>
    </div>`;
}

el('docForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = el('verifyBtn');
  setLoading(btn, true, 'Verify document');
  try {
    const r = await fetch('/documents', { method: 'POST', body: new FormData(e.target), headers: authHeaders() });
    const data = await r.json();
    if (!r.ok) { alert(data.detail || 'Verification failed'); return; }

    el('resultsSection').classList.remove('hide');
    const colors = SCORE_COLORS[data.label] || SCORE_COLORS.Failed;
    const pill = el('labelBadge');
    pill.style.background = colors.bg; pill.style.color = colors.text;
    pill.textContent = data.label;
    el('scoreText').style.color = colors.text;
    el('scoreText').textContent = data.score === null ? '—' : data.score;
    el('reasonText').textContent = data.reason || '—';

    const subs = data.sub_scores || {};
    el('subScoreGrid').innerHTML = ['signature', 'tamper', 'ocr', 'anomaly']
      .map((k) => renderSubScore(k, subs[k])).join('');

    const heatmapWrap = el('heatmapWrap');
    if (data.heatmap_url) {
      // <img src> can't carry an Authorization header, and this route requires one
      // (NFR-9) -- fetch it ourselves and hand the <img> a blob URL instead.
      const imgResp = await fetch(data.heatmap_url, { headers: authHeaders() });
      const blob = await imgResp.blob();
      el('heatmap').src = URL.createObjectURL(blob);
      heatmapWrap.classList.remove('hide');
    } else {
      heatmapWrap.classList.add('hide');
    }

    el('rawJson').textContent = JSON.stringify(data, null, 2);
    el('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } finally {
    setLoading(btn, false, 'Verify document');
  }
});
</script>
</body>
</html>
